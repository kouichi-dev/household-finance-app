name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env を作る
        run: |
          echo "POSTGRES_PASSWORD=ci" >> .env
          echo "POSTGRES_DB=household_finance" >> .env
          echo "DATABASE_URL=postgresql://postgres:ci@db:5432/household_finance" >> .env
          echo "TEST_DATABASE_URL=postgresql://postgres:ci@db:5432/household_test" >> .env
          echo "SECRET_KEY=ci-dummy" >> .env
      - run: docker compose run --rm app pytest tests/
